name: Milestone Fork Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable release after all target-native qualification and human approval
        required: true
        default: false
        type: boolean
      release_tag_confirmation:
        description: Type v0.33.2-milestone.1 when publication is approved
        required: false
        type: string
      release_source_sha_confirmation:
        description: Type the full reviewed source commit SHA
        required: true
        type: string

concurrency:
  group: milestone-fork-release-v0.33.2-milestone.1
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: 0.33.2-milestone.1
  RELEASE_TAG: v0.33.2-milestone.1
  UPSTREAM_BASE_TAG: v0.33.2
  UPSTREAM_BASE_COMMIT: 93cdda5709e8861c0c26b0b955d8d746e9fda0d7
  NATIVE_BINARY_NAMES: >-
    agent-browser-darwin-arm64
    agent-browser-darwin-x64
    agent-browser-linux-arm64
    agent-browser-linux-musl-arm64
    agent-browser-linux-musl-x64
    agent-browser-linux-x64
    agent-browser-win32-x64.exe

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify version
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";

          const version = process.env.RELEASE_VERSION;
          for (const file of [
            "package.json",
            "packages/dashboard/package.json",
            "packages/@agent-browser/eve/package.json",
            "packages/@agent-browser/sandbox/package.json",
          ]) {
            assert.equal(JSON.parse(fs.readFileSync(file, "utf8")).version, version, file);
          }
          assert.equal(
            fs.readFileSync("packages/@agent-browser/sandbox/src/version.ts", "utf8"),
            `export const AGENT_BROWSER_SANDBOX_VERSION = "${version}";\n`,
          );
          NODE
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)" = "$RELEASE_VERSION"
          test "$(cargo metadata --format-version 1 --locked --no-deps --manifest-path cli/Cargo.toml | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).packages.find(p=>p.name==='agent-browser').version))")" = "$RELEASE_VERSION"

      - name: Verify upstream base
        run: |
          test "$(git rev-parse "refs/tags/${UPSTREAM_BASE_TAG}^{commit}")" = "$UPSTREAM_BASE_COMMIT"
          git merge-base --is-ancestor "$UPSTREAM_BASE_COMMIT" "$GITHUB_SHA"

      - name: Format
        run: cargo fmt --manifest-path cli/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml --all-targets --all-features -- --test-threads=1

      - name: Real Chrome target lifecycle regressions
        run: |
          cargo test --manifest-path cli/Cargo.toml e2e_immediate_alert_popup_is_registered_before_page_script_runs -- --ignored --test-threads=1
          cargo test --manifest-path cli/Cargo.toml e2e_no_dialog_popup_still_auto_targets_and_recovers -- --ignored --test-threads=1
          cargo test --manifest-path cli/Cargo.toml e2e_explicit_tab_new_keeps_one_flat_session_per_target -- --ignored --test-threads=1
          cargo test --manifest-path cli/Cargo.toml e2e_launch_keeps_one_flat_session_per_existing_target -- --ignored --test-threads=1
          cargo test --manifest-path cli/Cargo.toml e2e_external_last_tab_close_recovers_with_a_prepared_page -- --ignored --test-threads=1
          cargo test --manifest-path cli/Cargo.toml e2e_immediate_confirm_and_prompt_popups_require_explicit_decisions -- --ignored --test-threads=1
          cargo test --manifest-path cli/Cargo.toml e2e_background_confirm_survives_an_active_auto_handled_alert -- --ignored --test-threads=1
          cargo test --manifest-path cli/Cargo.toml e2e_no_auto_dialog_tracks_immediate_alert_for_explicit_resolution -- --ignored --test-threads=1
          cargo test --manifest-path cli/Cargo.toml e2e_auto_attached_worker_is_resumed -- --ignored --test-threads=1
          cargo test --manifest-path cli/Cargo.toml e2e_closing_dialog_tab_prunes_its_pending_state -- --ignored --test-threads=1
          cargo test --manifest-path cli/Cargo.toml e2e_preexisting_dialog_attach_fails_bounded_without_accepting_it -- --ignored --test-threads=1
          cargo test --manifest-path cli/Cargo.toml e2e_preexisting_dialog_in_noninitial_tab_is_bounded_and_not_accepted -- --ignored --test-threads=1
          cargo test --manifest-path cli/Cargo.toml e2e_failed_popup_target_does_not_wedge_following_commands -- --ignored --test-threads=1

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            build_target: x86_64-unknown-linux-gnu.2.28
            source_binary: agent-browser
            binary: agent-browser-linux-x64
            use_zigbuild: true
          - name: Linux ARM64
            os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            build_target: aarch64-unknown-linux-gnu.2.28
            source_binary: agent-browser
            binary: agent-browser-linux-arm64
            use_zigbuild: true
          - name: Linux musl x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            build_target: x86_64-unknown-linux-musl
            source_binary: agent-browser
            binary: agent-browser-linux-musl-x64
            use_zigbuild: true
          - name: Linux musl ARM64
            os: ubuntu-latest
            rust_target: aarch64-unknown-linux-musl
            build_target: aarch64-unknown-linux-musl
            source_binary: agent-browser
            binary: agent-browser-linux-musl-arm64
            use_zigbuild: true
          - name: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            build_target: x86_64-pc-windows-msvc
            source_binary: agent-browser.exe
            binary: agent-browser-win32-x64.exe
            use_zigbuild: false
          - name: macOS x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            build_target: x86_64-apple-darwin
            source_binary: agent-browser
            binary: agent-browser-darwin-x64
            use_zigbuild: false
          - name: macOS ARM64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            build_target: aarch64-apple-darwin
            source_binary: agent-browser
            binary: agent-browser-darwin-arm64
            use_zigbuild: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install JavaScript dependencies
        if: runner.os != 'Windows'
        run: pnpm install --frozen-lockfile

      - name: Install JavaScript dependencies on Windows
        if: runner.os == 'Windows'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Sync version
        run: pnpm run version:sync

      - name: Build embedded dashboard
        run: pnpm --filter dashboard build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        run: |
          pip3 install ziglang==0.13.0
          cargo install cargo-zigbuild --version 0.22.3 --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build with zigbuild
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --manifest-path cli/Cargo.toml --target ${{ matrix.build_target }}

      - name: Build with cargo
        if: ${{ matrix.use_zigbuild == false }}
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.rust_target }}

      - name: Collect binary
        run: |
          mkdir -p artifacts
          cp cli/target/${{ matrix.rust_target }}/release/${{ matrix.source_binary }} artifacts/${{ matrix.binary }}
          chmod +x artifacts/${{ matrix.binary }}
          test "$(wc -c < "artifacts/${{ matrix.binary }}")" -ge 100000

      - name: Verify Linux GNU glibc floor
        if: matrix.binary == 'agent-browser-linux-x64' || matrix.binary == 'agent-browser-linux-arm64'
        run: |
          if objdump -p artifacts/${{ matrix.binary }} | grep -E 'GLIBC_2\.([3-9][0-9]|29)'; then
            echo "${{ matrix.binary }} requires glibc newer than 2.28"
            exit 1
          fi

      - name: Verify target-native Windows version
        if: runner.os == 'Windows'
        run: test "$(artifacts/${{ matrix.binary }} --version)" = "agent-browser $RELEASE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: artifacts/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create immutable fork release
    needs: [verify, build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Confirm human-controlled publication
        env:
          RELEASE_TAG_CONFIRMATION: ${{ inputs.release_tag_confirmation }}
          RELEASE_SOURCE_SHA_CONFIRMATION: ${{ inputs.release_source_sha_confirmation }}
        run: |
          if [ "$RELEASE_TAG_CONFIRMATION" != "$RELEASE_TAG" ]; then
            echo "Refusing publication without exact release tag confirmation: $RELEASE_TAG"
            exit 1
          fi
          if [ "$RELEASE_SOURCE_SHA_CONFIRMATION" != "$GITHUB_SHA" ]; then
            echo "Refusing publication without exact reviewed source confirmation: $GITHUB_SHA"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true

      - name: Assemble package and provenance
        run: |
          mkdir -p bin release-assets
          read -r -a expected_binaries <<< "$NATIVE_BINARY_NAMES"
          printf '%s\n' "${expected_binaries[@]}" | LC_ALL=C sort > expected-binaries.txt
          find downloaded -maxdepth 1 -type f -name 'agent-browser-*' -exec basename {} \; | LC_ALL=C sort > actual-binaries.txt
          diff -u expected-binaries.txt actual-binaries.txt
          for binary in "${expected_binaries[@]}"; do
            cp "downloaded/$binary" "bin/$binary"
            cp "downloaded/$binary" "release-assets/$binary"
          done
          chmod +x bin/agent-browser-*

          npm pack --json --silent > pack-output.json
          PACKAGE_FILE=$(node -p "JSON.parse(require('fs').readFileSync('pack-output.json', 'utf8'))[0].filename")
          PACKAGE_INTEGRITY=$(node -p "JSON.parse(require('fs').readFileSync('pack-output.json', 'utf8'))[0].integrity")
          test "$PACKAGE_FILE" = "agent-browser-${RELEASE_VERSION}.tgz"
          test -n "$PACKAGE_INTEGRITY"
          mv "$PACKAGE_FILE" release-assets/
          test "$(tar -xOf "release-assets/$PACKAGE_FILE" package/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")" = "$RELEASE_VERSION"
          tar -tzf "release-assets/$PACKAGE_FILE" | sed -n 's#^package/bin/\(agent-browser-.*\)#\1#p' | LC_ALL=C sort > package-binaries.txt
          diff -u expected-binaries.txt package-binaries.txt
          ACTUAL_PACKAGE_INTEGRITY=$(node -e "const fs=require('fs');const crypto=require('crypto');const hash=crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64');console.log('sha512-'+hash)" "release-assets/$PACKAGE_FILE")
          test "$ACTUAL_PACKAGE_INTEGRITY" = "$PACKAGE_INTEGRITY"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg baseTag "$UPSTREAM_BASE_TAG" \
            --arg baseCommit "$UPSTREAM_BASE_COMMIT" \
            --arg upstreamPullRequest "https://github.com/vercel-labs/agent-browser/pull/1603" \
            --arg upstreamIssue "https://github.com/vercel-labs/agent-browser/issues/1602" \
            --arg workflowRun "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg packageFile "$PACKAGE_FILE" \
            --arg packageIntegrity "$PACKAGE_INTEGRITY" \
            --arg binaryNames "$NATIVE_BINARY_NAMES" \
            '{
              repository: $repository,
              sourceCommit: $sourceCommit,
              version: env.RELEASE_VERSION,
              tag: env.RELEASE_TAG,
              upstreamBase: {tag: $baseTag, commit: $baseCommit},
              upstreamContribution: {issue: $upstreamIssue, pullRequest: $upstreamPullRequest},
              package: {filename: $packageFile, integrity: $packageIntegrity},
              nativeBinaries: ($binaryNames | split(" ")),
              checksumManifest: "SHA256SUMS",
              workflowRun: $workflowRun
            }' > release-assets/SOURCE-PROVENANCE.json

          (
            cd release-assets
            sha256sum "${expected_binaries[@]}" "$PACKAGE_FILE" SOURCE-PROVENANCE.json | LC_ALL=C sort -k2 > SHA256SUMS
            test "$(wc -l < SHA256SUMS)" -eq 9
            sha256sum --check SHA256SUMS
          )

      - name: Create immutable tag and release
        run: |
          set -euo pipefail
          CREATED_TAG_SHA=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA" \
            --jq '.object.sha')
          test "$CREATED_TAG_SHA" = "$GITHUB_SHA"
          REMOTE_TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')
          test "$REMOTE_TAG_SHA" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes "Project-controlled compatibility release preserving Milestone's bounded dialog safety, flat auto-attach and canonical sessions, worker lifecycle, and Windows daemon/process cleanup while retaining upstream discarded-tab recovery and stream fixes. Based on upstream $UPSTREAM_BASE_TAG at $UPSTREAM_BASE_COMMIT; see SOURCE-PROVENANCE.json and SHA256SUMS." \
            release-assets/*
        env:
          GH_TOKEN: ${{ github.token }}
